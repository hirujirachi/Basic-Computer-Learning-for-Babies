<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Kiki, maskot KOMPUTERKU">
  <defs>
    <radialGradient id="kiki-body-grad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5ED9D1"/>
      <stop offset="100%" stop-color="#3ABDB5"/>
    </radialGradient>
    <radialGradient id="kiki-screen-grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#FFF0DC"/>
    </radialGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .kiki-float { animation: kikiFloat 3s ease-in-out infinite; }
      .kiki-blink { animation: kikiBlink 4s ease-in-out infinite; }
      .kiki-antenna { animation: kikiAntenna 2s ease-in-out infinite; }
    }
    @keyframes kikiFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes kikiBlink {
      0%,90%,100% { transform: scaleY(1); }
      95%          { transform: scaleY(0.08); }
    }
    @keyframes kikiAntenna {
      0%,100% { transform: rotate(-5deg); transform-origin: 100px 42px; }
      50%     { transform: rotate(5deg);  transform-origin: 100px 42px; }
    }
  </style>

  <g class="kiki-float">
    <line x1="100" y1="42" x2="100" y2="20" stroke="#FF6B35" stroke-width="3.5" stroke-linecap="round" class="kiki-antenna"/>
    <circle cx="100" cy="13" r="9" fill="#FFE66D" stroke="#F5D700" stroke-width="2"/>

    <rect x="22" y="42" width="156" height="118" rx="22" fill="url(#kiki-body-grad)" stroke="#2E9E96" stroke-width="2"/>
    <rect x="34" y="54" width="132" height="96" rx="14" fill="url(#kiki-screen-grad)"/>

    <g class="kiki-blink">
      <circle cx="80" cy="96" r="17" fill="white" stroke="#C8EFEC" stroke-width="1.5"/>
      <circle cx="120" cy="96" r="17" fill="white" stroke="#C8EFEC" stroke-width="1.5"/>
      <circle cx="84" cy="99" r="9" fill="#2C3E50"/>
      <circle cx="124" cy="99" r="9" fill="#2C3E50"/>
      <circle cx="87" cy="96" r="4" fill="white"/>
      <circle cx="127" cy="96" r="4" fill="white"/>
      <circle cx="80" cy="104" r="2" fill="#2C3E50" opacity="0.3"/>
      <circle cx="120" cy="104" r="2" fill="#2C3E50" opacity="0.3"/>
    </g>

    <circle cx="64" cy="118" r="11" fill="#FFB3A7" opacity="0.55"/>
    <circle cx="136" cy="118" r="11" fill="#FFB3A7" opacity="0.55"/>

    <path d="M 76 128 Q 100 148 124 128" stroke="#FF6B35" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <rect x="128" y="62" width="28" height="20" rx="6" fill="#FFE66D" stroke="#F5D700" stroke-width="1.5"/>
    <line x1="135" y1="72" x2="149" y2="72" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="78" x2="143" y2="78" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>

    <rect x="40" y="156" width="120" height="10" rx="5" fill="#2E9E96" opacity="0.4"/>

    <rect x="82" y="160" width="36" height="14" rx="4" fill="#2E9E96"/>
    <rect x="62" y="174" width="76" height="10" rx="5" fill="#FF6B35"/>

    <rect x="22" y="42" width="30" height="30" rx="12" fill="#FFE66D" opacity="0.0"/>
    <text x="34" y="40" font-size="18" opacity="0.65">✨</text>
    <text x="150" y="52" font-size="14" opacity="0.55">⭐</text>
  </g>
</svg>
